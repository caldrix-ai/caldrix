name: Bug report
description: Something in caldrix does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: version
    attributes:
      label: caldrix --version
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: caldrix doctor
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The exact command you ran
      render: sh
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened, with the full output
      render: text
    validations:
      required: true
